name: "Tests"

on:
    push:
        branches:
            - "main"
    pull_request: null
    schedule:
        # Do not make it the first of the month and/or midnight since it is a very busy time
        - cron: "* 10 5 * *"
# See https://stackoverflow.com/a/72408109
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: "${{ matrix.operating-system }}"
        name: "Tests with PHP ${{ matrix.php }} and Symfony ${{ matrix.symfony }} on ${{ matrix.operating-system }}"
        # Unstable builds (e.g. PHP nightly) may fail without failing the workflow.
        continue-on-error: ${{ matrix.experimental == true }}
        strategy:
            fail-fast: true
            matrix:
                operating-system: [ "ubuntu-latest" ]
                php:
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                symfony:
                    - "unchanged"
                    - "6.*.*"
                    - "7.*.*"
                dependency-versions:
                    - "highest"
                    - "lowest"
                include:
                    - operating-system: "windows-latest"
                      php: "8.4"
                      dependency-versions: "highest"
                      symfony: "unchanged"
                    - operating-system: "ubuntu-latest"
                      php: "8.6"
                      dependency-versions: "highest"
                      symfony: "unchanged"
                      experimental: true
                      composer-options: "--ignore-platform-req=php+"

        steps:
            -   name: "Check out repository code"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            -   name: "Setup PHP"
                uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # master
                with:
                    php-version: "${{ matrix.php }}"
                    tools: "composer, flex"

            -   name: "Configure Symfony version"
                if: "matrix.symfony != 'unchanged'"
                run: "echo \"SYMFONY_REQUIRE=${{ matrix.symfony }}\" >> $GITHUB_ENV"

            -   name: "Install Composer dependencies"
                uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0
                with:
                    dependency-versions: "${{ matrix.dependency-versions }}"
                    composer-options: "${{ matrix.composer-options }}"

            -   name: "Run tests"
                run: "make phpunit"

    infection:
        runs-on: "ubuntu-latest"
        name: "Infection with PHP ${{ matrix.php }}"
        strategy:
            fail-fast: true
            matrix:
                php:
                    - "8.4"

        steps:
            -   name: "Check out repository code"
                uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            -   name: "Setup PHP"
                uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # master
                with:
                    php-version: "${{ matrix.php }}"
                    tools: "composer"
                    coverage: "xdebug"

            -   name: "Install Composer dependencies"
                uses: "ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda" # 4.0.0

            -   name: "Run tests and mutation testing"
                run: "make infection"

    # This is a "trick", a meta task which does not change, and we can use in
    # the protected branch rules as opposed to the individual tests which
    # may change regularly.
    validate-tests:
        name: Tests Status
        runs-on: ubuntu-latest
        needs:
            - tests
            - infection
        if: always()
        steps:
            - name: Successful run
              if: ${{ !(contains(needs.*.result, 'failure')) }}
              run: exit 0

            - name: Failing run
              if: ${{ contains(needs.*.result, 'failure') }}
              run: exit 1
