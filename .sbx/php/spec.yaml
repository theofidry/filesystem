---
schemaVersion: "2"
kind: mixin
name: fidry-filesystem-php
displayName: Fidry FileSystem PHP
description: PHP, Composer and PIE for working on the Composer package `fidry/filesystem`.

permissions:
    network:
        allow:
            # Ubuntu apt mirrors, to install PHP at startup.
            # ports.ubuntu.com serves arm64; archive/security serve amd64.
            - "ports.ubuntu.com"
            - "archive.ubuntu.com"
            - "security.ubuntu.com"

            # The claude template image ships a NodeSource apt source; without
            # this, `apt-get update` gets a 403 from the proxy and aborts the
            # PHP install.
            - "deb.nodesource.com:443"

            # The public Composer package repository, also used by PIE to find
            # extensions.
            - "repo.packagist.org:443"

            # Dist downloads for Composer packages, and PIE's release and
            # extension downloads, all hosted on GitHub.
            - "api.github.com:443"
            - "codeload.github.com:443"
            - "objects.githubusercontent.com:443"
setup:
    install:
        - command: |
              set -e
              export DEBIAN_FRONTEND=noninteractive

              # The claude kit runs its own `apt-get update` on first boot, so this
              # step can start while the apt lock is held. Retry until the lock frees
              # up (or ~5 minutes pass).
              apt_retry() {
                  i=0
                  until "$@"; do
                      i=$((i + 1))
                      [ "$i" -ge 60 ] && return 1
                      sleep 5
                  done
              }

              apt_retry apt-get update
              # php-dev, build-essential and autoconf are what PIE needs to build
              # an extension.
              apt_retry apt-get install -y --no-install-recommends \
                  php-cli \
                  php-mbstring \
                  php-xml \
                  php-curl \
                  php-zip \
                  php-pcov \
                  php-dev \
                  build-essential \
                  autoconf \
                  unzip \
                  composer
          user: "0"
          description: Install PHP and Composer.
